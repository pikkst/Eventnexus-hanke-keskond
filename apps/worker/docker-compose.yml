services:
  redis:
    image: redis:7.2.5-alpine3.19
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - WORKER_REDIS_HOST=redis
      - WORKER_REDIS_PORT=6379
      - WORKER_THREADS=2
      - WORKER_MAX_RETRIES=3
      - WORKER_TASK_TIMEOUT=60000
      - WORKER_DEAD_LETTER_QUEUE=dead_letter
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis-data:
