name: Complete Phase 0 task statuses

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-phase0-tasks.yml

permissions:
  contents: write

jobs:
  update-task-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark completed Phase 0 documentation tasks
        shell: python
        run: |
          from pathlib import Path

          path = Path("TASKS.md")
          content = path.read_text(encoding="utf-8")

          task_ids = [f"S0-T{i:02d}" for i in range(3, 16)]
          for task_id in task_ids:
              old = f"- [ ] **{task_id}"
              new = f"- [x] **{task_id}"
              if old not in content and new not in content:
                  raise SystemExit(f"Expected task marker not found: {task_id}")
              content = content.replace(old, new, 1)

          metric_old = "- [ ] Pilot success metrics defined."
          metric_new = "- [x] Pilot success metrics defined."
          if metric_old not in content and metric_new not in content:
              raise SystemExit("Pilot success metrics checklist item not found")
          content = content.replace(metric_old, metric_new, 1)

          path.write_text(content, encoding="utf-8")

      - name: Remove temporary workflow and commit status update
        shell: bash
        run: |
          rm .github/workflows/complete-phase0-tasks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASKS.md .github/workflows/complete-phase0-tasks.yml
          git commit -m "docs(tasks): complete Phase 0 research tasks"
          git push
