          agents_task_row = "| STARTER onboarding/matching/partner/growth | `STARTER_MODE.md`, `PRODUCT_REQUIREMENTS.md`, `COMPANY_PROFILE_REQUIREMENTS.md`, `PILOT_SUCCESS_METRICS.md`, `DOCUMENT_CLASSIFICATION_POLICY.md`, `AI_THREAT_MODEL.md` |"
          insert_after(
              "AGENTS.md",
              "| Company profile/evidence/matching | `PRODUCT_REQUIREMENTS.md`, `COMPANY_PROFILE_REQUIREMENTS.md`, `DOCUMENT_CLASSIFICATION_POLICY.md`, `AI_THREAT_MODEL.md` |",
              agents_task_row,
