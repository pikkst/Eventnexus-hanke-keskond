      - name: Commit product direction
        shell: bash
        run: |
          rm -f .github/workflows/apply-starter-strategy.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "EventNexus Documentation Agent"
          git config user.email "actions@users.noreply.github.com"
          git add README.md AGENTS.md TASKS.md docs/product .github || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs(product): add STARTER-first opportunity strategy"
          git push origin HEAD:main
