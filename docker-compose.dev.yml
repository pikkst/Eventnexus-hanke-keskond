services:
  web:
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"

  api:
    environment:
      - APP_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-eventnexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventnexus}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=true
      - LOG_LEVEL=debug
      - LOG_FORMAT=console
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      - APP_ENV=development
      - WORKER_REDIS_HOST=redis
      - WORKER_REDIS_PORT=6379
      - WORKER_REDIS_DB=0
      - WORKER_REDIS_PASSWORD=
      - WORKER_THREADS=2
      - WORKER_MAX_RETRIES=3
      - WORKER_TASK_TIMEOUT=60000
      - WORKER_DEAD_LETTER_QUEUE=dead_letter
      - DEBUG=true
      - LOG_LEVEL=debug
      - LOG_FORMAT=console
    volumes:
      - ./apps/worker:/app
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8001 --reload

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend
    restart: unless-stopped
